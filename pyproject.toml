[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MixSIAPy"
version = "0.1.0"
description = "A native Python implementation of MixSIAR Bayesian mixing models"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
keywords = ["bayesian", "stable-isotope", "mixing-model", "ecology", "pymc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2,<3", "pandas>=1.5", "scipy>=1.9", "matplotlib>=3.6"]

[project.optional-dependencies]
bayes = ["pymc>=5.10", "arviz>=0.16", "filelock", "cloudpickle"]
fast = ["pymc>=5.10", "arviz>=0.16", "nutpie>=0.13"]
jax = ["pymc>=5.10", "arviz>=0.16", "jax>=0.4", "numpyro>=0.15", "blackjax>=1.2"]
all-backends = ["pymc>=5.10", "arviz>=0.16", "nutpie>=0.13", "jax>=0.4", "numpyro>=0.15", "blackjax>=1.2"]
test = ["pytest>=7"]
dev = ["build>=1", "ruff>=0.5"]
gui = ["streamlit>=1.30", "plotly>=5.18"]
desktop-build = ["pyinstaller>=6.10"]

[project.scripts]
mixsiapy-gui = "mixsiapy.gui:main"

[project.urls]
Documentation = "https://github.com/jyangfsu/MixSIAPy#readme"
Issues = "https://github.com/jyangfsu/MixSIAPy/issues"
Source = "https://github.com/jyangfsu/MixSIAPy"

[tool.setuptools.packages.find]
include = ["mixsiapy*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
mixsiapy = [
  "data/*.csv",
  "examples/*.py",
  "docs/*.md",
  "docs/*.docx",
  "gui/*.py",
  "gui/assets/*.svg",
  "gui/assets/*.png",
  "reference_r/DESCRIPTION",
  "reference_r/NAMESPACE",
  "reference_r/R/*.R",
  "reference_r/example_scripts/*.R",
  "reference_r/tests/*.R",
  "reference_r/tests/testthat/*.R",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
